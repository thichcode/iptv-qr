plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tizenbrew.iptv'
    compileSdk 34

    defaultConfig {
        applicationId "com.tizenbrew.iptv"
        minSdk 21
        targetSdk 34
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1
        versionName project.hasProperty('versionName') ? project.property('versionName').toString() : "1.1.22"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'androidx.media3:media3-exoplayer:1.1.1'
}
