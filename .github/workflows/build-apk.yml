name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Set version from run number
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_NAME=1.1.${{ github.run_number }}" >> $GITHUB_ENV
          echo "TAG_NAME=v1.1.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Copy web assets
        run: |
          mkdir -p android-app/app/src/main/assets
          cp -r android/* android-app/app/src/main/assets/

      - name: Generate IPTV+QR icon using ImageMagick
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi

          generate_icon() {
            local SIZE=$1
            local OUT=$2
            local FONT_SIZE=$((SIZE * 28 / 100))
            local QR_SIZE=$((SIZE * 22 / 100))
            local QR_X=$((SIZE - QR_SIZE - SIZE * 6 / 100))
            local QR_Y=$((SIZE - QR_SIZE - SIZE * 6 / 100))
            local CELL=$((QR_SIZE / 7))

            convert -size ${SIZE}x${SIZE} xc:'#080907' \
              -fill '#d8ff45' -font DejaVu-Sans-Bold -pointsize ${FONT_SIZE} \
              -gravity center -annotate +0-$((${SIZE}/12)) 'IPTV' \
              \( -size ${QR_SIZE}x${QR_SIZE} xc:'#080907' \
                 -fill '#d8ff45' \
                 -draw "rectangle 0,0 $((CELL-1)),$((CELL-1))" \
                 -draw "rectangle $((CELL*2)),0 $((CELL*3-1)),$((CELL-1))" \
                 -draw "rectangle $((CELL*4)),0 $((CELL*5-1)),$((CELL-1))" \
                 -draw "rectangle $((CELL*6)),0 $((CELL*7-1)),$((CELL-1))" \
                 -draw "rectangle 0,$((CELL*2)) $((CELL-1)),$((CELL*3-1))" \
                 -draw "rectangle $((CELL*2)),$((CELL*2)) $((CELL*3-1)),$((CELL*3-1))" \
                 -draw "rectangle $((CELL*4)),$((CELL*2)) $((CELL*5-1)),$((CELL*3-1))" \
                 -draw "rectangle $((CELL*6)),$((CELL*2)) $((CELL*7-1)),$((CELL*3-1))" \
                 -draw "rectangle 0,$((CELL*4)) $((CELL-1)),$((CELL*5-1))" \
                 -draw "rectangle $((CELL*2)),$((CELL*4)) $((CELL*3-1)),$((CELL*5-1))" \
                 -draw "rectangle $((CELL*4)),$((CELL*4)) $((CELL*5-1)),$((CELL*5-1))" \
                 -draw "rectangle $((CELL*6)),$((CELL*4)) $((CELL*7-1)),$((CELL*5-1))" \
                 -draw "rectangle 0,$((CELL*6)) $((CELL-1)),$((CELL*7-1))" \
                 -draw "rectangle $((CELL*2)),$((CELL*6)) $((CELL*3-1)),$((CELL*7-1))" \
                 -draw "rectangle $((CELL*4)),$((CELL*6)) $((CELL*5-1)),$((CELL*7-1))" \
                 -draw "rectangle $((CELL*6)),$((CELL*6)) $((CELL*7-1)),$((CELL*7-1))" \
              \) -geometry +${QR_X}+${QR_Y} -composite \
              "$OUT"
          }

          generate_icon 48  android-app/app/src/main/res/mipmap-mdpi/ic_launcher.png
          generate_icon 72  android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
          generate_icon 96  android-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          generate_icon 144 android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

      - name: Make gradlew executable
        run: |
          cd android-app
          gradle wrapper --gradle-version 8.4

      - name: Build APK
        run: |
          cd android-app
          ./gradlew assembleDebug -PversionCode=${{ env.VERSION_CODE }} -PversionName=${{ env.VERSION_NAME }}

      - name: Rename APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk iptv-player.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player
          path: iptv-player.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: IPTV Player ${{ env.VERSION_NAME }}
          body: |
            ## IPTV Player for Android TV v${{ env.VERSION_NAME }}

            ### Install
            1. Download `iptv-player.apk` below
            2. Transfer to your Android TV (USB, AirSend, etc.)
            3. Install the APK (enable "Unknown sources" if needed)
            4. Open IPTV Player and scan QR code with your phone

            ### Features
            - QR code setup (no remote typing)
            - Channel groups
            - D-Pad remote controls
            - Fullscreen mode
          files: iptv-player.apk
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
